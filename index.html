<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#063b61">
<title>Control Diario de Reparto</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/docx/8.5.0/docx.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/FileSaver.js/2.0.5/FileSaver.min.js"></script>
<style>
:root{--azul:#063b61;--celeste:#079bb0;--celeste2:#00aec4;--fondo:#edf4f7;--texto:#16364b;--borde:#cfdee6;--rojo:#e53935;--verde:#16885c;--naranja:#e88a18;--sombra:0 8px 24px rgba(20,61,84,.09)}
*{box-sizing:border-box}body{margin:0;min-height:100vh;font-family:Arial,Helvetica,sans-serif;background:linear-gradient(180deg,#f6fafc,var(--fondo));color:var(--texto)}
.app{width:min(100%,480px);margin:auto;padding:14px 13px 28px}.encabezado{display:flex;align-items:center;gap:12px;min-height:72px;padding:10px 14px;border-radius:7px;color:#fff;background:linear-gradient(135deg,#063252,#06476e);box-shadow:var(--sombra)}
.logo{width:52px;height:52px;object-fit:contain;border-radius:10px;background:#fff;padding:3px}.encabezado h1{margin:0;font-size:20px;line-height:1.1}.encabezado p{margin:4px 0 0;font-size:12px;opacity:.92}
.tarjeta{margin-top:10px;padding:15px;border-radius:11px;background:#fff;box-shadow:var(--sombra)}.titulo-seccion{display:flex;align-items:center;gap:9px;margin:0 0 12px;color:var(--azul);font-size:17px}
label{display:block;margin:9px 0 5px;color:var(--azul);font-size:12px;font-weight:700}input,textarea{width:100%;border:1px solid var(--borde);border-radius:7px;background:#fbfdfe;color:var(--texto);padding:10px 11px;font:inherit;font-size:14px;outline:none}input:focus,textarea:focus{border-color:var(--celeste);box-shadow:0 0 0 3px rgba(7,155,176,.12)}input[readonly]{background:#f1f7f9}textarea{min-height:68px;resize:vertical}
.fila,.botones-captura,.acciones-registro{display:grid;grid-template-columns:1fr 1fr;gap:10px}.acciones-exportar{display:grid;grid-template-columns:1fr 1fr 1fr;gap:8px;margin-top:9px}
button,.boton-archivo{display:flex;align-items:center;justify-content:center;gap:8px;width:100%;min-height:42px;border:0;border-radius:7px;padding:10px 12px;color:#fff;font-weight:700;font-size:13px;cursor:pointer}button:disabled{opacity:.65;cursor:not-allowed}.boton-archivo input{display:none}
.btn-azul{background:var(--azul)}.btn-celeste{background:linear-gradient(135deg,var(--celeste),var(--celeste2))}.btn-borde{color:var(--celeste);background:#fff;border:1px solid var(--celeste)}.btn-verde{background:var(--verde)}.btn-naranja{background:var(--naranja)}.btn-rojo{background:var(--rojo)}.btn-word{background:#0877c9}.btn-whatsapp{background:#063b5a}.separacion{margin-top:9px}
.vista-imagen{display:none;width:100%;max-height:190px;margin-top:10px;object-fit:contain;border:1px solid var(--borde);border-radius:8px;background:#f5f8fa}.calculo{margin-top:10px;padding:10px;border-radius:6px;color:#17627b;background:#eaf7fa;font-size:11px;line-height:1.4}
.lista-productos{display:grid;gap:8px;margin-top:10px}.producto-item{padding:10px;border:1px solid var(--borde);border-radius:8px;background:#f9fcfd;font-size:12px}.producto-item strong{display:block;color:var(--azul);margin-bottom:3px}.mini-acciones{display:grid;grid-template-columns:1fr 1fr;gap:7px;margin-top:8px}.mini-acciones button{min-height:32px;padding:5px;font-size:11px}
.estado{display:none;margin-top:10px;padding:10px;border-radius:7px;font-size:12px;font-weight:700;text-align:center}.estado.ok{display:block;color:#0a6642;background:#e6f7ef}.estado.error{display:block;color:#9d2020;background:#fdecec}.estado.proceso{display:block;color:#155b79;background:#eaf6fb}#reporteExportacion{background:#fff}
@media(max-width:370px){.fila,.botones-captura,.acciones-registro,.acciones-exportar{grid-template-columns:1fr}}
</style>
</head>
<body>
<main class="app">
<header class="encabezado"><img src="Logo.jpg" class="logo" alt="Logo"><div><h1>Control Diario de Reparto</h1><p>Registro de productos entregados</p></div></header>
<section class="tarjeta">
<h2 class="titulo-seccion">📷 Capturar información</h2>
<div class="botones-captura"><label class="boton-archivo btn-azul">📷 Tomar foto<input id="camara" type="file" accept="image/*" capture="environment"></label><label class="boton-archivo btn-celeste">🖼 Elegir imagen<input id="galeria" type="file" accept="image/*"></label></div>
<img id="vistaImagen" class="vista-imagen" alt="Vista previa">
<label for="descripcion">Describe el reparto</label><textarea id="descripcion" placeholder="Ejemplo: Se recibió 5 cajas de Coca Cola lata, se entregaron 3 cajas, precio $3.20"></textarea>
<button id="procesar" class="btn-celeste separacion" type="button">✨ Procesar con IA</button>
</section>
<section class="tarjeta">
<h2 class="titulo-seccion">📄 Revisar registro</h2>
<label for="producto">Producto</label><input id="producto" type="text" placeholder="Nombre del producto" readonly>
<div class="fila"><div><label for="cantidadInicial">Cantidad inicial</label><input id="cantidadInicial" type="number" min="0" step="1" value="0" readonly></div><div><label for="cantidadEntregada">Cantidad entregada</label><input id="cantidadEntregada" type="number" min="0" step="1" value="0" readonly></div></div>
<div class="fila"><div><label for="cantidadRestante">Cantidad restante</label><input id="cantidadRestante" type="number" readonly value="0"></div><div><label for="precio">Precio</label><input id="precio" type="number" min="0" step="0.01" value="0.00" readonly></div></div>
<div class="fila"><div><label for="total">Total</label><input id="total" type="text" readonly value="$0.00"></div><div><label for="valorRestante">Valor restante</label><input id="valorRestante" type="text" readonly value="$0.00"></div></div>
<div id="calculo" class="calculo"></div>
<button id="agregar" class="btn-borde separacion" type="button">＋ Agregar producto</button>
<div id="pendientes" class="estado" style="display:block;margin-top:8px">Productos pendientes: 0</div>

</section>
<section class="tarjeta">
<button id="guardar" class="btn-celeste" type="button">💾 Guardar registro</button>
<div class="acciones-registro separacion"><button id="modificar" class="btn-naranja" type="button">✏️ Modificar</button><button id="borrar" class="btn-rojo" type="button">🗑️ Eliminar registro</button></div>
<button id="limpiar" class="btn-borde separacion" type="button">↻ Limpiar formulario</button>
<div class="acciones-exportar"><button id="word" class="btn-word" type="button">📝 Word</button><button id="pdf" class="btn-rojo" type="button">📄 PDF</button><button id="whatsapp" class="btn-whatsapp" type="button">◉ WhatsApp</button></div>
<div id="estado" class="estado"></div>
</section>
<div id="reporteExportacion" hidden></div>
</main>
<script>
let modoEdicion=false;
const FUNCTION_URL='https://func-inv-westus-02-cafcdda6cudub0hh.westus3-01.azurewebsites.net/api/ProcessInventory';
const $=id=>document.getElementById(id);const productos=[];let imagenBase64='';let itemIdActual=null;
const DB_NAME='ControlDiarioRepartoDB',DB_VERSION=1,STORE_NAME='pendientes';
function abrirDB(){return new Promise((resolve,reject)=>{if(!('indexedDB' in window))return reject(new Error('El almacenamiento local no está disponible.'));const req=indexedDB.open(DB_NAME,DB_VERSION);req.onupgradeneeded=()=>{if(!req.result.objectStoreNames.contains(STORE_NAME))req.result.createObjectStore(STORE_NAME,{keyPath:'id',autoIncrement:true})};req.onsuccess=()=>resolve(req.result);req.onerror=()=>reject(req.error||new Error('No se pudo abrir el almacenamiento local.'))})}
async function guardarPendientesLocal(){const db=await abrirDB();return new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite'),store=tx.objectStore(STORE_NAME);store.clear();productos.forEach(p=>store.add({producto:p}));tx.oncomplete=()=>{db.close();actualizarPendientes();resolve()};tx.onerror=()=>{db.close();reject(tx.error||new Error('No se pudieron guardar los productos temporalmente.'))}})}
async function cargarPendientesLocal(){try{const db=await abrirDB();const datos=await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readonly'),req=tx.objectStore(STORE_NAME).getAll();req.onsuccess=()=>resolve(req.result||[]);req.onerror=()=>reject(req.error)});db.close();productos.push(...datos.map(x=>x.producto).filter(Boolean));actualizarPendientes();if(productos.length)estado(`Se recuperaron ${productos.length} producto(s) pendientes.`,'ok')}catch(e){actualizarPendientes()}}
async function limpiarPendientesLocal(){try{const db=await abrirDB();await new Promise((resolve,reject)=>{const tx=db.transaction(STORE_NAME,'readwrite');tx.objectStore(STORE_NAME).clear();tx.oncomplete=resolve;tx.onerror=()=>reject(tx.error)});db.close();actualizarPendientes()}catch(e){}}
function actualizarPendientes(){const el=$('pendientes');if(el)el.textContent=`Productos pendientes: ${productos.length}`}

const campos={producto:$('producto'),inicial:$('cantidadInicial'),entregada:$('cantidadEntregada'),restante:$('cantidadRestante'),precio:$('precio'),total:$('total'),valorRestante:$('valorRestante')};
function dinero(v){return new Intl.NumberFormat('en-US',{style:'currency',currency:'USD'}).format(Number(v)||0)}
function calcular(){const i=Number(campos.inicial.value)||0,e=Number(campos.entregada.value)||0,p=Number(campos.precio.value)||0,r=Math.max(0,i-e),t=e*p,vr=r*p;campos.restante.value=r;campos.total.value=dinero(t);campos.valorRestante.value=dinero(vr);$('calculo').textContent=`▦ Cálculos: ${i} - ${e} = ${r} | ${e} × ${dinero(p)} = ${dinero(t)} | ${r} × ${dinero(p)} = ${dinero(vr)}`}
['inicial','entregada','precio'].forEach(k=>campos[k].addEventListener('input',calcular));
function cargarImagen(file){if(!file)return;const r=new FileReader();r.onload=e=>{imagenBase64=e.target.result;$('vistaImagen').src=imagenBase64;$('vistaImagen').style.display='block'};r.readAsDataURL(file)}
$('camara').addEventListener('change',e=>cargarImagen(e.target.files[0]));$('galeria').addEventListener('change',e=>cargarImagen(e.target.files[0]));
async function llamar(body,method='POST'){const res=await fetch(FUNCTION_URL,{method,headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});let data={};try{data=await res.json()}catch{}if(!res.ok||data.success===false)throw new Error(data.error||`Error HTTP ${res.status}`);return data}
$('procesar').addEventListener('click',async()=>{const descripcion=$('descripcion').value.trim();if(!descripcion&&!imagenBase64)return estado('Escribe una descripción o selecciona una imagen.','error');$('procesar').disabled=true;estado('Procesando con IA...','proceso');try{const r=await llamar({accion:'procesar',descripcion,imagen:imagenBase64});const d=r.datos||{};campos.producto.value=d.Producto||'';campos.inicial.value=d.CantidadInicial??0;campos.entregada.value=d.CantidadEntregada??0;campos.precio.value=d.Precio??0;calcular();bloquearCampos();estado('Información procesada con IA. Revisa los datos.','ok')}catch(e){estado(`No se pudo procesar: ${e.message}`,'error')}finally{$('procesar').disabled=false}});
function productoActual(){const p={Producto:campos.producto.value.trim(),CantidadInicial:Number(campos.inicial.value),CantidadEntregada:Number(campos.entregada.value),Precio:Number(campos.precio.value)};if(!p.Producto)throw new Error('Escribe el nombre del producto.');if(![p.CantidadInicial,p.CantidadEntregada,p.Precio].every(Number.isFinite))throw new Error('Completa cantidades y precio.');if(p.CantidadInicial<0||p.CantidadEntregada<0||p.Precio<0)throw new Error('No se permiten valores negativos.');if(p.CantidadEntregada>p.CantidadInicial)throw new Error('La cantidad entregada supera la cantidad inicial.');p.CantidadRestante=p.CantidadInicial-p.CantidadEntregada;p.Total=Number((p.CantidadEntregada*p.Precio).toFixed(2));p.ValorRestante=Number((p.CantidadRestante*p.Precio).toFixed(2));return p}
function bloquearCampos(){campos.producto.readOnly=true;campos.inicial.readOnly=true;campos.entregada.readOnly=true;campos.precio.readOnly=true}
function habilitarCampos(){campos.producto.readOnly=false;campos.inicial.readOnly=false;campos.entregada.readOnly=false;campos.precio.readOnly=false}
function limpiarFormulario(){campos.producto.value='';campos.inicial.value=0;campos.entregada.value=0;campos.precio.value='0.00';$('descripcion').value='';$('camara').value='';$('galeria').value='';$('vistaImagen').src='';$('vistaImagen').style.display='none';imagenBase64='';bloquearCampos();calcular()}
$('agregar').onclick=async()=>{try{productos.push(productoActual());await guardarPendientesLocal();campos.producto.value='';campos.inicial.value=0;campos.entregada.value=0;campos.precio.value='0.00';$('descripcion').value='';$('camara').value='';$('galeria').value='';$('vistaImagen').src='';$('vistaImagen').style.display='none';imagenBase64='';bloquearCampos();calcular();estado(`Producto agregado. Pendientes: ${productos.length}`,'ok')}catch(e){estado(e.message,'error')}};
$('guardar').onclick=async()=>{let registros=[...productos];if(!registros.length){try{registros=[productoActual()]}catch(e){return estado(e.message,'error')}}$('guardar').disabled=true;estado(`Guardando ${registros.length} registro(s)...`,'proceso');try{for(const p of registros){const r=await llamar({accion:'guardar',...p});itemIdActual=r.itemId}productos.length=0;await limpiarPendientesLocal();modoEdicion=false;limpiarFormulario();estado(`${registros.length} registro(s) guardado(s) correctamente.`,'ok')}catch(e){estado(`No se pudo guardar: ${e.message}`,'error')}finally{$('guardar').disabled=false;actualizarPendientes()}};
$('modificar').onclick=async()=>{try{if(!itemIdActual)throw new Error('No hay un registro guardado para modificar.');if(!modoEdicion){modoEdicion=true;habilitarCampos();estado('Campos habilitados. Edita los datos y vuelve a presionar Modificar para guardar los cambios.','ok');return}const p=productoActual();estado('Modificando registro...','proceso');await llamar({accion:'modificar',itemId:itemIdActual,...p},'PATCH');modoEdicion=false;bloquearCampos();estado('Registro modificado correctamente.','ok')}catch(e){estado(e.message,'error')}};
$('borrar').onclick=async()=>{try{if(!itemIdActual)throw new Error('No hay un registro guardado para borrar.');estado('Borrando registro...','proceso');await llamar({accion:'borrar',itemId:itemIdActual},'DELETE');itemIdActual=null;limpiarFormulario();estado('Registro borrado correctamente.','ok')}catch(e){estado(e.message,'error')}};
$('limpiar').onclick=()=>{limpiarFormulario();estado('Formulario limpio.','ok')};
cargarPendientesLocal();
function datosReporte(){if(productos.length)return [...productos];try{return[productoActual()]}catch{return[]}}
function reporteHTML(ds){
 const fecha=new Date().toLocaleString('es-SV');
 const filas=ds.map(p=>`<tr><td>${escapar(p.Producto)}</td><td>${p.CantidadInicial}</td><td>${p.CantidadEntregada}</td><td>${p.CantidadRestante}</td><td>${dinero(p.Precio)}</td><td>${dinero(p.Total)}</td><td>${dinero(p.ValorRestante)}</td></tr>`).join('');
 return `<div class="documento-reporte"><h1>Control Diario de Reparto</h1><p class="fecha-reporte">${fecha}</p><table><thead><tr><th>Producto</th><th>Inicial</th><th>Entregada</th><th>Restante</th><th>Precio</th><th>Total</th><th>Valor restante</th></tr></thead><tbody>${filas}</tbody></table></div>`;
}
function estilosReporte(){return `<style>*{box-sizing:border-box}body{font-family:Arial,Helvetica,sans-serif;color:#17384d;margin:0;padding:24px;background:#fff}.documento-reporte{width:100%;background:#fff;padding:12px}h1{margin:0 0 8px;color:#063b61;font-size:26px}.fecha-reporte{margin:0 0 20px;color:#536b7a;font-size:12px}table{width:100%;border-collapse:collapse;table-layout:fixed;font-size:11px}th{background:#063b61;color:#fff;padding:9px 6px;border:1px solid #c9d8df;text-align:center}td{padding:8px 6px;border:1px solid #c9d8df;text-align:center;word-break:break-word}td:first-child,th:first-child{text-align:left;width:25%}tbody tr:nth-child(even){background:#f2f7f9}</style>`}
function crearPDFBlob(datos){
 if(!datos.length)throw new Error('No hay datos para exportar.');
 if(!window.jspdf||!window.jspdf.jsPDF)throw new Error('No se pudo cargar la librería PDF.');

 const {jsPDF}=window.jspdf;
 const doc=new jsPDF({orientation:'landscape',unit:'mm',format:'a4'});
 const pageWidth=doc.internal.pageSize.getWidth();
 const pageHeight=doc.internal.pageSize.getHeight();

 const margin=10;
 const cols=[
  {title:'Producto',width:72,align:'left'},
  {title:'Inicial',width:25,align:'center'},
  {title:'Entregada',width:30,align:'center'},
  {title:'Restante',width:28,align:'center'},
  {title:'Precio',width:28,align:'center'},
  {title:'Total',width:30,align:'center'},
  {title:'Valor restante',width:38,align:'center'}
 ];
 const tableWidth=cols.reduce((s,c)=>s+c.width,0);
 const x0=Math.max(margin,(pageWidth-tableWidth)/2);
 const headerH=9;
 let y=28;

 function dibujarEncabezado(){
  doc.setFont('helvetica','bold');
  doc.setFontSize(20);
  doc.setTextColor(6,59,97);
  doc.text('Control Diario de Reparto',margin,15);

  doc.setFont('helvetica','normal');
  doc.setFontSize(8);
  doc.setTextColor(83,107,122);
  doc.text(new Date().toLocaleString('es-SV'),margin,21);

  let x=x0;
  doc.setFillColor(6,59,97);
  doc.setDrawColor(6,59,97);
  doc.setTextColor(255,255,255);
  doc.setFont('helvetica','bold');
  doc.setFontSize(8);

  cols.forEach(c=>{
   doc.rect(x,y,c.width,headerH,'FD');
   doc.text(c.title,x+c.width/2,y+6,{align:'center'});
   x+=c.width;
  });
  y+=headerH;
 }

 function nuevaPagina(){
  doc.addPage();
  y=28;
  dibujarEncabezado();
 }

 dibujarEncabezado();

 doc.setFont('helvetica','normal');
 doc.setFontSize(8);
 doc.setTextColor(22,54,75);

 datos.forEach(p=>{
  const producto=String(p.Producto??'');
  const lineas=doc.splitTextToSize(producto,cols[0].width-4);
  const alto=Math.max(9,lineas.length*4+5);

  if(y+alto>pageHeight-10)nuevaPagina();

  let x=x0;
  cols.forEach((c,i)=>{
   doc.setFillColor(255,255,255);
   doc.setDrawColor(201,216,223);
   doc.rect(x,y,c.width,alto,'FD');

   let valor='';
   if(i===0)valor=producto;
   if(i===1)valor=String(p.CantidadInicial??0);
   if(i===2)valor=String(p.CantidadEntregada??0);
   if(i===3)valor=String(p.CantidadRestante??0);
   if(i===4)valor=dinero(p.Precio);
   if(i===5)valor=dinero(p.Total);
   if(i===6)valor=dinero(p.ValorRestante);

   const texto=i===0?lineas:[valor];
   const tx=c.align==='left'?x+2:x+c.width/2;
   const opts=c.align==='left'?{}:{align:'center'};
   doc.text(texto,tx,y+5,opts);
   x+=c.width;
  });
  y+=alto;
 });

 return doc.output('blob');
}

async function generarPDF(datos){
 const blob=crearPDFBlob(datos);
 const url=URL.createObjectURL(blob);
 const enlace=document.createElement('a');
 enlace.href=url;
 enlace.download='control-diario-reparto.pdf';
 document.body.appendChild(enlace);
 enlace.click();
 enlace.remove();
 setTimeout(()=>URL.revokeObjectURL(url),1000);
}

$('pdf').onclick=async()=>{try{const datos=datosReporte();await generarPDF(datos);estado('PDF generado correctamente.','ok')}catch(e){estado(`No se pudo generar el PDF: ${e.message}`,'error')}};
$('word').onclick=()=>{
 const datos=datosReporte();if(!datos.length)return estado('No hay datos para exportar.','error');
 try{const contenido=`<!DOCTYPE html><html><head><meta charset="UTF-8">${estilosReporte()}</head><body>${reporteHTML(datos)}</body></html>`;const blob=new Blob(['\ufeff',contenido],{type:'application/msword;charset=utf-8'});const url=URL.createObjectURL(blob);const enlace=document.createElement('a');enlace.href=url;enlace.download='control-diario-reparto.doc';document.body.appendChild(enlace);enlace.click();enlace.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);estado('Documento Word generado correctamente.','ok')}catch(e){estado(`No se pudo generar Word: ${e.message}`,'error')}
};
$('whatsapp').onclick=async()=>{
 const d=datosReporte();if(!d.length)return estado('No hay datos para compartir.','error');
 if(d.length===1){
  const text=['*Control Diario de Reparto*',...d.map(p=>`${p.Producto}: inicial ${p.CantidadInicial}, entregada ${p.CantidadEntregada}, restante ${p.CantidadRestante}, total ${dinero(p.Total)}`)].join('\n');
  if(navigator.share){try{await navigator.share({title:'Control Diario de Reparto',text});return}catch(e){if(e.name==='AbortError')return}}
  window.open(`https://wa.me/?text=${encodeURIComponent(text)}`,'_blank','noopener,noreferrer');
  return;
 }
 try{
  estado('Preparando PDF para compartir...','proceso');
  const blob=crearPDFBlob(d);
  const archivo=new File([blob],'control-diario-reparto.pdf',{type:'application/pdf'});
  if(navigator.canShare&&navigator.canShare({files:[archivo]})){
   await navigator.share({title:'Control Diario de Reparto',text:'Control Diario de Reparto',files:[archivo]});
   estado('PDF compartido correctamente.','ok');
  }else{
   const url=URL.createObjectURL(blob);
   const enlace=document.createElement('a');
   enlace.href=url;
   enlace.download='control-diario-reparto.pdf';
   document.body.appendChild(enlace);
   enlace.click();
   enlace.remove();
   setTimeout(()=>URL.revokeObjectURL(url),1000);
   estado('PDF generado. El navegador no permite adjuntarlo directamente desde aquí.','ok');
